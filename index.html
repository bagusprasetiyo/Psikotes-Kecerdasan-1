<html lang="id"><head><meta charset="utf-8">

<title>PSIKOTES MASTER 2026</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf6f6;--card:#fff;--tx:#231517;--mu:#6b5a5d;--pr:#b3151f;--prt:#fff;--bd:#eadcdd;--ok:#15803d;--okb:#dcfce7;--er:#b91c1c;--erb:#fee2e2;--mk:#b45309;--mkb:#fef3c7}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.btn.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-height:52px;padding:10px 14px;margin:8px 0;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.opt.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 10%,var(--card))}.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.bad{border-color:var(--er);background:var(--erb)}
.opt i{font-style:normal;font-weight:700;min-width:28px;height:28px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;flex:none}
.lay{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:800px){.lay{grid-template-columns:1fr 250px}}
.nv{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.nv button{min-height:40px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.nv .a{background:var(--pr);color:var(--prt)}.nv .m{background:var(--mkb);color:var(--mk);border-color:var(--mk)}.nv .c{outline:3px solid var(--tx)}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden}.bar div{height:100%;background:var(--pr)}
.figs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0;color:var(--tx)}svg{max-width:100%;color:var(--tx)}
.tag{font-size:13px;padding:2px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mu)}
.ex{background:var(--bg);border-radius:10px;padding:12px;margin-top:10px;font-size:15px}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:20}.modal .card{max-width:380px;margin:0}
.t{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}.ok{color:var(--ok)}.er{color:var(--er)}
select{min-height:40px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;padding:0 8px}
</style></head><body><div id="app"></div>
<script>
// ===== BANK SOAL (dipisah dari logika) =====
const FG={F:"15,10 45,10 45,20 25,20 25,28 40,28 40,38 25,38 25,52 15,52"};
const Q=[
{id:"V01",c:"Verbal",s:"Analogi Kata",d:"Sulit",k:"Hubungan fungsi alat dan besaran",q:"KOMPAS : ARAH = JAM : ...",o:["Waktu","Detik","Dinding","Tangan","Angka"],a:0,
e:"Langkah: (1) Kompas adalah alat yang fungsinya menunjukkan arah. (2) Jam adalah alat yang fungsinya menunjukkan waktu. (3) Pola: alat : besaran yang ditunjukkan.",x:"Detik, tangan, dan angka adalah bagian jam, bukan besaran yang ditunjukkan. Dinding hanya tempat jam dipasang.",t:"Rumuskan hubungan pasangan pertama dalam satu kalimat, lalu terapkan. Kesalahan umum: memilih bagian benda, bukan fungsinya."},
{id:"V02",c:"Verbal",s:"Silogisme",d:"Sangat Sulit",k:"Validitas kesimpulan deduktif",q:"Premis 1: Semua dokter adalah sarjana.\nPremis 2: Tidak ada sarjana yang malas.\nKesimpulan yang pasti benar adalah ...",o:["Semua sarjana adalah dokter","Sebagian dokter malas","Tidak ada dokter yang malas","Semua orang yang tidak malas adalah dokter","Sebagian sarjana adalah dokter yang malas"],a:2,
e:"Langkah: dokter termasuk himpunan sarjana; sarjana tidak beririsan dengan malas. Karena dokter berada di dalam sarjana, dokter juga tidak beririsan dengan malas. Prinsip: transitivitas himpunan.",x:"A membalik premis 1 (tidak sah). B dan E bertentangan dengan premis 2. D membalik arah hubungan (tidak sah).",t:"Gambar diagram Venn. Kesalahan umum: menganggap hubungan 'semua A adalah B' berlaku dua arah."},
{id:"V03",c:"Verbal",s:"Penalaran Analitis",d:"Sulit",k:"Pengurutan dari beberapa premis",q:"Andi lebih tinggi daripada Budi. Budi lebih tinggi daripada Citra. Dedi lebih pendek daripada Citra tetapi lebih tinggi daripada Eka. Siapa yang tertinggi ketiga?",o:["Andi","Budi","Citra","Dedi","Eka"],a:2,
e:"Langkah: gabungkan premis menjadi satu rantai: Andi > Budi > Citra > Dedi > Eka. Urutan ketiga dari yang tertinggi adalah Citra.",x:"Andi tertinggi pertama, Budi kedua, Dedi keempat, Eka kelima.",t:"Tulis rantai urutan secara vertikal. Kesalahan umum: menghitung dari yang terpendek."},
{id:"V04",c:"Verbal",s:"Pemahaman Bacaan",d:"Penalaran Lanjut",k:"Inferensi dari data bacaan",q:"Sebuah kota menaikkan tarif parkir pusat kota sebesar 50% untuk mengurangi kemacetan. Enam bulan kemudian, jumlah kendaraan yang parkir turun 5%, sedangkan total pendapatan parkir meningkat. Kesimpulan yang paling didukung teks adalah ...",o:["Kenaikan tarif berhasil menghilangkan kemacetan","Kenaikan tarif jauh lebih besar daripada penurunan jumlah kendaraan, sehingga pendapatan naik","Pengendara beralih ke angkutan umum","Kemacetan tidak berkaitan dengan parkir","Tarif parkir sebaiknya dinaikkan lagi"],a:1,
e:"Langkah: pendapatan = tarif x jumlah kendaraan. Tarif menjadi 1,5 kali, jumlah menjadi 0,95 kali, sehingga pendapatan menjadi 1,5 x 0,95 = 1,425 kali. Hanya opsi B yang bisa diturunkan dari data teks.",x:"A berlebihan (turun 5% bukan hilang). C dan D adalah asumsi di luar teks. E adalah saran, bukan kesimpulan.",t:"Pilih kesimpulan yang tidak menambah informasi baru. Kesalahan umum: memilih opsi yang masuk akal tetapi tidak disebut teks."},
{id:"N01",c:"Numerik",s:"Deret Angka",d:"Sangat Sulit",k:"Pola selisih berupa bilangan kuadrat",q:"Tentukan angka berikutnya: 3, 4, 8, 17, 33, ...",o:["56","57","58","59","60"],a:2,
e:"Selisih antarsuku: 1, 4, 9, 16 yaitu 1², 2², 3², 4². Selisih berikutnya 5² = 25. Jadi 33 + 25 = 58.",x:"56, 57, 59, 60 berasal dari menambah selisih 23, 24, 26, 27 yang tidak mengikuti pola kuadrat.",t:"Hitung selisih tingkat pertama; jika tidak tetap, cek bilangan kuadrat atau selisih kedua. Kesalahan umum: terpaku pada pola kelipatan."},
{id:"N02",c:"Numerik",s:"Persentase",d:"Sulit",k:"Perubahan persentase berturut-turut",q:"Harga suatu barang naik 20%, kemudian turun 20% dari harga baru. Harga akhir dibandingkan harga awal adalah ...",o:["100%","98%","96%","94%","92%"],a:2,
e:"Misal harga awal 100. Setelah naik 20%: 100 x 1,2 = 120. Turun 20%: 120 x 0,8 = 96. Jadi 96% dari harga awal.",x:"100% muncul jika persentase dijumlahkan langsung (+20 - 20 = 0). Opsi lain tidak sesuai hitungan.",t:"Gunakan faktor pengali 1,2 x 0,8. Kesalahan umum: menjumlahkan persentase yang basisnya berbeda."},
{id:"N03",c:"Numerik",s:"Aljabar",d:"Sangat Sulit",k:"Manipulasi bentuk kuadrat",q:"Jika x + 1/x = 3, maka nilai x² + 1/x² adalah ...",o:["5","6","7","8","9"],a:2,
e:"Kuadratkan: (x + 1/x)² = x² + 2 + 1/x² = 9. Maka x² + 1/x² = 9 - 2 = 7. Rumus: (a+b)² = a² + 2ab + b² dengan ab = 1.",x:"9 muncul jika lupa mengurangi 2ab. Opsi lain berasal dari kesalahan aritmetika.",t:"Kuadratkan bentuk yang diketahui. Kesalahan umum: mengira x² + 1/x² = 3² = 9."},
{id:"N04",c:"Numerik",s:"Soal Cerita (Pekerjaan)",d:"Sulit",k:"Laju kerja gabungan",q:"Pekerja A menyelesaikan suatu pekerjaan dalam 10 hari, pekerja B dalam 15 hari. Jika keduanya bekerja bersama, pekerjaan selesai dalam ... hari.",o:["5","6","7","8","9"],a:1,
e:"Laju A = 1/10, laju B = 1/15. Gabungan: 1/10 + 1/15 = 3/30 + 2/30 = 5/30 = 1/6 pekerjaan per hari. Waktu = 6 hari.",x:"5 (rata-rata 10 dan 15 dibagi 2 keliru), 7 hingga 9 tidak memenuhi 1/waktu = 1/6.",t:"Jumlahkan laju, bukan waktu. Kesalahan umum: merata-ratakan waktu 10 dan 15."},
{id:"F01",c:"Figural",s:"Analogi Bentuk",d:"Sulit",k:"Aturan perubahan isian (kosong ke terisi)",q:"Persegi kosong : persegi terisi = lingkaran kosong : ...",fig:[{t:"sq",f:0},{t:"sq",f:1},{t:"ci",f:0},{t:"q"}],o:["x","x","x","x","x"],of:[{t:"ci",f:0},{t:"ci",f:1},{t:"sq",f:1},{t:"tri",f:1},{t:"tri",f:0}],a:1,
e:"Aturan: bentuk tetap, isian berubah dari kosong menjadi terisi. Lingkaran kosong menjadi lingkaran terisi.",x:"Lingkaran kosong tidak berubah; persegi dan segitiga mengubah bentuk, padahal bentuk seharusnya tetap.",t:"Pisahkan atribut: bentuk, isian, ukuran, posisi. Kesalahan umum: mengubah dua atribut sekaligus."},
{id:"F02",c:"Figural",s:"Serial Gambar",d:"Sangat Sulit",k:"Rotasi bertahap searah jarum jam",q:"Tentukan gambar berikutnya.",fig:[{t:"arrow",a:0},{t:"arrow",a:45},{t:"arrow",a:90},{t:"arrow",a:135},{t:"q"}],o:["x","x","x","x","x"],of:[{t:"arrow",a:90},{t:"arrow",a:225},{t:"arrow",a:180},{t:"arrow",a:135},{t:"arrow",a:270}],a:2,
e:"Panah berputar 45° searah jarum jam tiap langkah: 0°, 45°, 90°, 135°, lalu 135° + 45° = 180° (menunjuk ke bawah).",x:"90° dan 135° sudah muncul; 225° dan 270° melompat lebih dari 45°.",t:"Hitung sudut tiap langkah. Kesalahan umum: salah arah putar (searah vs berlawanan)."},
{id:"F03",c:"Figural",s:"Serial Gambar",d:"Sulit",k:"Penambahan jumlah sisi",q:"Tentukan gambar berikutnya.",fig:[{t:"poly",n:3},{t:"poly",n:4},{t:"poly",n:5},{t:"poly",n:6},{t:"q"}],o:["x","x","x","x","x"],of:[{t:"poly",n:5},{t:"poly",n:8},{t:"poly",n:7},{t:"poly",n:6},{t:"poly",n:4}],a:2,
e:"Jumlah sisi bertambah 1 tiap langkah: 3, 4, 5, 6, maka berikutnya 7 sisi (segi tujuh).",x:"5, 6, dan 4 sisi sudah/mundur; 8 sisi melompat 2.",t:"Hitung sisi atau titik sudut tiap gambar. Kesalahan umum: salah menghitung sisi poligon yang mirip lingkaran."},
{id:"F04",c:"Figural",s:"Rotasi dan Pencerminan",d:"Penalaran Lanjut",k:"Pencerminan horizontal vs rotasi",q:"Manakah bayangan cermin horizontal (kiri-kanan) dari bentuk F berikut?",fig:[{t:"F",x:""}],o:["x","x","x","x","x"],of:[{t:"F",x:"rotate(180 30 30)"},{t:"F",x:"translate(60 0) scale(-1 1)"},{t:"F",x:"translate(0 60) scale(1 -1)"},{t:"F",x:"rotate(90 30 30)"},{t:"F",x:""}],a:1,
e:"Pencerminan kiri-kanan membalik posisi x (x menjadi 60 - x), sehingga bagian lengan F yang semula di kanan berada di kiri, sementara bagian atas tetap di atas.",x:"A adalah rotasi 180° (lengan di kiri tetapi terbalik ke bawah). C adalah pencerminan atas-bawah. D adalah rotasi 90°. E adalah gambar asli.",t:"Lacak satu ciri khas (lengan F). Kesalahan umum: menyamakan rotasi 180° dengan pencerminan."}
];
const CATS=["Verbal","Numerik","Figural"];
function validate(){const ids=new Set(),er=[];Q.forEach(q=>{if(ids.has(q.id))er.push("ID ganda "+q.id);ids.add(q.id);
const o=q.of||q.o;if(!o||o.length!==5)er.push(q.id+": opsi != 5");if(!(q.a>=0&&q.a<5))er.push(q.id+": kunci tidak valid");if(!q.e||!q.x||!q.t)er.push(q.id+": pembahasan kosong");});return er}
// ===== FIGURAL SVG =====
function fig(s){let f=s.f?"currentColor":"none",st='stroke="currentColor" stroke-width="3" stroke-linejoin="round"',b="";
if(s.t=="sq")b=`<rect x="12" y="12" width="36" height="36" fill="${f}" ${st}/>`;
else if(s.t=="ci")b=`<circle cx="30" cy="30" r="18" fill="${f}" ${st}/>`;
else if(s.t=="tri")b=`<polygon points="30,10 50,48 10,48" fill="${f}" ${st}/>`;
else if(s.t=="arrow")b=`<g transform="rotate(${s.a} 30 30)" ${st}><line x1="30" y1="50" x2="30" y2="14"/><polygon points="30,6 21,20 39,20" fill="currentColor"/></g>`;
else if(s.t=="poly"){let p=[];for(let i=0;i<s.n;i++){let a=-Math.PI/2+2*Math.PI*i/s.n;p.push((30+22*Math.cos(a)).toFixed(1)+","+(30+22*Math.sin(a)).toFixed(1))}b=`<polygon points="${p.join(" ")}" fill="none" ${st}/>`}
else if(s.t=="F")b=`<polygon transform="${s.x}" points="${FG.F}" fill="currentColor"/>`;
else b=`<text x="30" y="40" text-anchor="middle" font-size="32" fill="currentColor">?</text>`;
return `<svg viewBox="0 0 60 60" width="64" height="64" role="img" aria-label="gambar">${b}</svg>`}
// ===== STATE =====
const $=id=>document.getElementById(id),L="A B C D E".split(" ");
let S={v:"home",qs:Q,ans:{},mk:{},i:0,end:0,start:0,modal:0,mode:"exam",res:null,flt:"Semua",wrong:0,done:{}},TI=null;
function hist(){try{return JSON.parse(localStorage.getItem("tiu26")||"[]")}catch(e){return[]}}
function save(h){try{localStorage.setItem("tiu26",JSON.stringify(h))}catch(e){}}
function go(v){S.v=v;render();window.scrollTo(0,0)}
function startExam(){S.qs=Q;S.ans={};S.mk={};S.i=0;S.mode="exam";S.start=Date.now();S.end=S.start+Q.length*60000;S.modal=0;go("exam");clearInterval(TI);TI=setInterval(tick,500)}
function tick(){let l=Math.max(0,S.end-Date.now()),e=$("tm");if(e)e.textContent=fmt(l);if(l<=0)finish()}
function fmt(ms){let s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function finish(){clearInterval(TI);let r={n:Q.length,ben:0,sal:0,kos:0,cat:{},sub:{},dur:Math.min(Date.now(),S.end)-S.start,t:new Date().toLocaleString("id-ID")};
CATS.forEach(c=>r.cat[c]={b:0,n:0});
Q.forEach((q,i)=>{let a=S.ans[i],cs=r.cat[q.c];cs.n++;r.sub[q.s]=r.sub[q.s]||{b:0,n:0};r.sub[q.s].n++;
if(a==null)r.kos++;else if(a==q.a){r.ben++;cs.b++;r.sub[q.s].b++}else r.sal++});
r.sc=Math.round(r.ben/r.n*100);r.keyAns={...S.ans};let h=hist();h.push(r);save(h);S.res=r;S.modal=0;go("result")}
function pick(j){S.ans[S.i]=j;render()}
function nav(i){S.i=i;render()}
function tog(){S.mk[S.i]=!S.mk[S.i];render()}
// ===== VIEWS =====
const tp=(cur)=>`<nav><b>PSIKOTES MASTER 2026</b><button class="btn" onclick="go('home')">Beranda</button><button class="btn" onclick="go('dash')">Dashboard</button><button class="btn" onclick="go('study')">Mode Belajar</button></nav>`;
function pct(a,b){return b?Math.round(a/b*100):0}
function render(){let h="",v=S.v;
if(v=="home")h=tp()+`<main><div class="card hero"><h1>PSIKOTES MASTER 2026</h1><h3 class="mu">Advanced Intelligence Test</h3><p>Latihan psikotes tingkat sulit: verbal, numerik, dan figural, lengkap dengan pembahasan langkah demi langkah.</p>
<div class="row"><button class="btn p" onclick="go('info')">Mulai Tryout</button><button class="btn" onclick="go('study')">Pelajari Materi</button></div></div>

<div class="card mu">Seluruh soal adalah simulasi latihan orisinal, bukan soal resmi, bocoran, atau prediksi seleksi 2026. Skor bersifat indikator latihan, bukan skor resmi SKD dan bukan tes psikologi. Data tersimpan di peramban perangkat ini saja.</div></main>`;
else if(v=="info")h=tp()+`<main><div class="card"><h2>Petunjuk Ujian</h2><ul><li>Jumlah soal: ${Q.length}. Waktu: ${Q.length} menit (1 menit per soal, sebanding rasio 100 soal/100 menit).</li><li>Timer mulai saat Anda menekan Mulai Ujian dan dihitung dari waktu sistem, tetap akurat saat tab tidak aktif.</li><li>Pilih jawaban, pindah soal bebas, dan ubah jawaban sebelum ujian berakhir. Tandai soal untuk ditinjau.</li><li>Benar 1 poin, salah 0, kosong 0. Skor = benar / jumlah soal x 100.</li><li>Pembahasan hanya dibuka setelah ujian selesai.</li></ul><button class="btn p" onclick="startExam()">Mulai Ujian</button></div></main>`;
else if(v=="exam"){let q=Q[S.i],n=Q.length,an=Object.keys(S.ans).length,o=q.of||q.o;
h=`<nav><b>Soal ${S.i+1}/${n}</b><span class="t" id="tm">${fmt(Math.max(0,S.end-Date.now()))}</span><span class="tag">Terjawab ${an}/${n}</span></nav><main><div class="bar"><div style="width:${an/n*100}%"></div></div><br><div class="lay"><div class="card"><span class="tag">${q.c}</span> <span class="tag">${q.s}</span> <span class="tag">${q.d}</span>
<p style="white-space:pre-line;margin-top:12px">${q.q}</p>${q.fig?`<div class="figs">${q.fig.map(fig).join("")}</div>`:""}
${o.map((t,j)=>`<button class="opt ${S.ans[S.i]===j?"sel":""}" onclick="pick(${j})"><i>${L[j]}</i>${q.of?fig(t):t}</button>`).join("")}
<div class="row"><button class="btn" ${S.i?"":"disabled"} onclick="nav(S.i-1)">Sebelumnya</button><button class="btn" onclick="tog()">${S.mk[S.i]?"Hapus Tanda":"Tandai Soal"}</button><button class="btn" ${S.i<n-1?"":"disabled"} onclick="nav(S.i+1)">Berikutnya</button><button class="btn p" onclick="S.modal=1;render()">Akhiri Ujian</button></div></div>
<details class="card" open><summary><b>Navigasi Soal</b></summary><br><div class="nv">${Q.map((_,i)=>`<button class="${S.ans[i]!=null?"a":""} ${S.mk[i]?"m":""} ${i==S.i?"c":""}" onclick="nav(${i})">${i+1}</button>`).join("")}</div><p class="mu" style="font-size:14px">Biru: dijawab. Kuning: ditandai. Putih: belum dijawab.</p></details></div></main>
${S.modal?`<div class="modal"><div class="card"><h3>Akhiri ujian?</h3><p>Terjawab ${an} dari ${n}. Setelah diakhiri, jawaban dikunci.</p><div class="row"><button class="btn" onclick="S.modal=0;render()">Kembali</button><button class="btn p" onclick="finish()">Ya, Akhiri</button></div></div></div>`:""}`}
else if(v=="result"){let r=S.res,w=CATS.map(c=>[c,pct(r.cat[c].b,r.cat[c].n)]).sort((a,b)=>a[1]-b[1])[0];
